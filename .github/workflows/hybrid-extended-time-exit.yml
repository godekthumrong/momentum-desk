name: Hybrid Extended Time Exit Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: Backtest start date
        required: true
        default: "2016-01-01"
      end:
        description: Backtest end date (blank means latest)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt matplotlib
      - name: Run hybrid comparison
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SHORT_BT_START: ${{ inputs.start }}
          SHORT_BT_END: ${{ inputs.end }}
          SHORT_BT_OUTPUT: hybrid-extended-output
        run: python hybrid_extended_time_exit_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-extended-time-exit-${{ github.run_number }}
          path: hybrid-extended-output/
          if-no-files-found: error
          retention-days: 30
