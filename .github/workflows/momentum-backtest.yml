name: Momentum Backtest (manual)

# Twenty years of prices is a heavy download and the single most likely thing
# to get the runner rate-limited. It is deliberately NOT on a schedule.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of history"
        default: "20"
      top_n:
        description: "Positions held"
        default: "20"
      cash_hedge:
        description: "Leave blank for the normal run (parks regime-off cash in TLT). Set another ticker, or 'none' to hold plain cash, to try something else — a run with this set is a dry-run only and is NOT published to the site."
        default: ""

permissions:
  contents: write        # the report is committed back, see the last step

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Run backtest
        env:
          MOMENTUM_HEADLESS: "1"
          MOMENTUM_YEARS: ${{ inputs.years }}
          MOMENTUM_TOP_N: ${{ inputs.top_n }}
          MOMENTUM_CASH_HEDGE: ${{ inputs.cash_hedge }}
        run: python momentum_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentum-backtest-${{ github.run_number }}
          path: |
            momentum-backtest.html
            backtest-payload.json
          retention-days: 90

      # The daily job rebuilds _site from a fresh checkout every morning, so
      # the report has to live IN the repo to survive on the site — an
      # artifact would be gone from the URL by tomorrow. The payload rides
      # along because the dashboard reads it to draw its snapshot card.
      # A push made with GITHUB_TOKEN does not trigger workflows, so this
      # cannot set the daily job off in a loop.
      #
      # The normal run leaves cash_hedge blank, which means the script's own
      # default (TLT). A run that overrides it is a one-off experiment — it is
      # NOT published, so the live site and its snapshot card are untouched
      # until the change is deliberately promoted into the normal run.
      - name: Publish the report into the repo
        if: success() && inputs.cash_hedge == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f momentum-backtest.html backtest-payload.json
          if git diff --cached --quiet; then
            echo "report unchanged - nothing to commit"
          else
            git commit -m "Backtest report $(date -u +%F)"
            git push
          fi
