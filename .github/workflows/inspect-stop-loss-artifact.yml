name: Reprice Stop Loss Costs

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: Download cached stop-only orders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          gh run download 37020495368 --repo ${{ github.repository }} --name stop-loss-only-short-1 --dir downloaded
      - name: Reprice with slippage and 5 percent borrow
        run: |
          python reprice_stop_loss_costs.py --cache downloaded/profit-target-hybrid-orders.json.gz --slippage-bps 10 --borrow-rate 0.05
